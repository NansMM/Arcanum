# Publishes an Arcanum release for every "vX.Y.Z" tag (see tools/release.py).
# WowUp reads release.json to offer the update to WoW Forever players.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test suite (nothing is published if it fails)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install lupa==2.8
          python tools/test/run_tests.py

      - name: Package (zip, release.json, notes)
        run: python tools/package.py "${GITHUB_REF_NAME#v}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/release.json \
            --title "Arcanum ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
